# Nginx config for the Nimbus RM EC2 origin behind CloudFront.
# The deployment template replaces the token placeholder with a random secret.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json;

    map $http_x_origin_verify $nimbus_origin_allowed {
        default 0;
        "__ORIGIN_VERIFY_TOKEN__" 1;
    }

    map $http_cloudfront_forwarded_proto $viewer_proto {
        default $http_cloudfront_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 2m;

        if ($nimbus_origin_allowed = 0) { return 403; }

        location /static/ {
            alias /opt/nimbus/app/static/;
            expires 1h;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $viewer_proto;
            proxy_read_timeout 60s;
        }
    }
}
