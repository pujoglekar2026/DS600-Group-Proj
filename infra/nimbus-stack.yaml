AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Nimbus RM - VPC with public and private subnets, an EC2 web server running the
  Flask app behind Nginx, and an Amazon RDS MySQL database in private subnets.
  Works in a normal AWS account and in AWS Academy Learner Lab.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Application" }
        Parameters: [RepoUrl, RepoBranch, AppSecretKey]
      - Label: { default: "Database" }
        Parameters: [DBUsername, DBPassword, DBInstanceClass]
      - Label: { default: "Web server" }
        Parameters: [InstanceType, KeyName, SSHAllowedCidr, InstanceProfileName, LatestAmiId]

Parameters:
  RepoUrl:
    Type: String
    Description: HTTPS URL of your public GitHub repository, e.g. https://github.com/your-team/nimbus-rm.git
  RepoBranch:
    Type: String
    Default: main
  AppSecretKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Long random string used to sign login sessions (python3 -c "import secrets; print(secrets.token_hex(32))")
  DBUsername:
    Type: String
    Default: admin
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]{2,15}"
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9!#%^*_+=-]*"
    Description: RDS master password (8-41 chars; letters, digits and !#%^*_+=- only)
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t4g.micro]
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro, t3.small]
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key pair for SSH. In AWS Academy Learner Lab use "vockey".
  SSHAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may SSH to the web server. Restrict to your own IP (x.x.x.x/32) for better security.
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: >
      Existing IAM instance profile for the EC2 instance. Learner Lab provides
      "LabInstanceProfile". Leave EMPTY in a normal AWS account and the stack
      creates its own least-privilege role.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  CreateRole: !Equals [!Ref InstanceProfileName, ""]

Resources:
  # ------------------------------------------------------------------ VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: nimbus-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: nimbus-igw }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway }

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: nimbus-public-1 }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: nimbus-public-2 }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: nimbus-private-1 }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: nimbus-private-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: nimbus-public-rt }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }

  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }

  # Private subnets get a route table with no internet route: the database
  # can only be reached from inside the VPC.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: nimbus-private-rt }]

  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable }

  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable }

  # ------------------------------------------------------- Security groups
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: nimbus-web-sg
      GroupDescription: Nimbus web server - HTTP from anywhere, SSH from admin IP
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SSHAllowedCidr, Description: SSH }
      Tags: [{ Key: Name, Value: nimbus-web-sg }]

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: nimbus-db-sg
      GroupDescription: Nimbus database - MySQL only from the web server security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: MySQL from web tier only
      Tags: [{ Key: Name, Value: nimbus-db-sg }]

  # ------------------------------------------------------------------ RDS
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: nimbus-db-subnets
      DBSubnetGroupDescription: Private subnets for the Nimbus database
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: nimbus-db
      Engine: mysql  # no version pinned: RDS uses its current default MySQL version
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp2
      DBName: nimbus
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      StorageEncrypted: true
      Tags: [{ Key: Name, Value: nimbus-db }]

  # ------------------------------------------------------------------ IAM
  # Only created outside Learner Lab (Learner Lab does not allow creating roles).
  WebServerRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      RoleName: !Sub nimbus-web-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets you connect with Session Manager instead of SSH, and ship logs to CloudWatch.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateRole
    Properties:
      Roles: [!Ref WebServerRole]

  # ------------------------------------------------------------------ EC2
  WebServer:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute  # the database is already waited for via its endpoint below
    CreationPolicy:
      ResourceSignal: { Timeout: PT20M }
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !If [CreateRole, !Ref WebServerInstanceProfile, !Ref InstanceProfileName]
      Tags: [{ Key: Name, Value: nimbus-web }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/nimbus-bootstrap.log 2>&1
          dnf install -y git aws-cfn-bootstrap
          # Tell CloudFormation straight away if any step fails, instead of waiting 20 minutes.
          trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}' ERR
          git clone --branch "${RepoBranch}" "${RepoUrl}" /opt/nimbus
          cat > /opt/nimbus/.env <<'ENVEOF'
          SECRET_KEY=${AppSecretKey}
          DB_HOST=${Database.Endpoint.Address}
          DB_PORT=${Database.Endpoint.Port}
          DB_NAME=nimbus
          DB_USER=${DBUsername}
          DB_PASSWORD=${DBPassword}
          MARKET_DATA_PROVIDER=yahoo
          DEMO_FALLBACK=true
          CACHE_TTL=900
          ENVEOF
          sed -i 's/^[ \t]*//' /opt/nimbus/.env
          bash /opt/nimbus/deploy/setup_ec2.sh
          /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region} || true

Outputs:
  WebsiteURL:
    Description: Open this in your browser
    Value: !Sub http://${WebServer.PublicDnsName}
  WebServerPublicIP:
    Value: !GetAtt WebServer.PublicIp
  SSHCommand:
    Value: !Sub ssh -i labsuser.pem ec2-user@${WebServer.PublicDnsName}
  DatabaseEndpoint:
    Description: RDS endpoint (reachable only from inside the VPC)
    Value: !GetAtt Database.Endpoint.Address
  VpcId:
    Value: !Ref VPC
